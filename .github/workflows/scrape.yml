name: Scrape Penn Courses

on:
  schedule:
    # Run daily at 6 AM UTC (2 AM ET)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggers
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scrape.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: |
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --deploy

      - name: Restore database from artifact
        uses: actions/download-artifact@v4
        with:
          name: course-database
          path: ./db
        continue-on-error: true  # First run won't have artifact

      - name: Scrape current and next term
        run: |
          # Create db directory
          mkdir -p ./db

          # Scrape current term
          pipenv run scraper --db ./db/courses.db scrape

          # Scrape next term
          pipenv run scraper --db ./db/courses.db scrape --next-term

      - name: Export to JSON (granular ADR-0002 structure)
        run: |
          pipenv run scraper --db ./db/courses.db export --output-dir .

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-database
          path: ./db/courses.db
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./api
          publish_branch: gh-pages
          commit_message: "chore: update course data $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Display statistics
        run: |
          pipenv run scraper --db ./db/courses.db stats
