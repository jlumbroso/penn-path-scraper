name: Scrape Penn Courses

on:
  schedule:
    # Run daily at 6 AM UTC (2 AM ET)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggers
  push:
    branches:
      - main
    paths-ignore:
      - 'landing/**'
      - 'api/index.html'
      - 'docs/**'
      - '**.md'

# Prevent concurrent scrapes (2.5h runtime, avoid overlaps)
concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes and creating releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: |
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --deploy

      - name: Restore database from latest release
        run: |
          mkdir -p ./db

          # Try to download compressed DB from latest-data release
          if gh release download latest-data -p "courses.db.gz" -D ./db/ 2>/dev/null; then
            gunzip ./db/courses.db.gz
            echo "✅ Restored database from latest-data release"
          else
            echo "ℹ️  No existing database found - starting fresh"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scrape current and next term
        run: |
          # Create db directory
          mkdir -p ./db

          # Scrape current term
          pipenv run scraper --db ./db/courses.db scrape

          # Scrape next term
          pipenv run scraper --db ./db/courses.db scrape --next-term

      - name: Export to JSON (granular ADR-0002 structure)
        run: |
          pipenv run scraper --db ./db/courses.db export --output-dir .

      - name: Compress database for release
        run: |
          # Compress database (10MB → ~2MB)
          gzip -9 -k ./db/courses.db
          echo "✅ Compressed database: $(du -h ./db/courses.db.gz | cut -f1)"

      - name: Create database manifest
        run: |
          # Create manifest for database discoverability
          DB_SIZE=$(stat -f%z ./db/courses.db.gz 2>/dev/null || stat -c%s ./db/courses.db.gz)
          DB_SHA256=$(sha256sum ./db/courses.db.gz | cut -d' ' -f1)

          cat > ./api/v1/db-manifest.json << EOF
          {
            "database": {
              "release_tag": "latest-data",
              "download_url": "https://github.com/${{ github.repository }}/releases/download/latest-data/courses.db.gz",
              "compressed_size": $DB_SIZE,
              "sha256": "$DB_SHA256",
              "format": "sqlite3",
              "compression": "gzip",
              "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            },
            "instructions": {
              "download": "curl -L https://github.com/${{ github.repository }}/releases/download/latest-data/courses.db.gz -o courses.db.gz",
              "decompress": "gunzip courses.db.gz"
            }
          }
          EOF

          echo "✅ Created database manifest at /api/v1/db-manifest.json"

      - name: Upload database to latest-data release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-data
          name: Latest Course Data
          files: ./db/courses.db.gz
          body: |
            **Latest Penn Course Data**

            Updated: ${{ github.event.head_commit.timestamp }}
            Workflow: ${{ github.run_id }}

            Download and decompress:
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/latest-data/courses.db.gz -o courses.db.gz
            gunzip courses.db.gz
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deployment directory (JSON only)
        run: |
          # Create deployment directory
          mkdir -p ./deploy

          # Copy landing page to root
          cp -r ./landing/* ./deploy/

          # Copy API data (JSON only, no database)
          cp -r ./api ./deploy/

          # Generate CNAME if configured
          if [ -f "config.json" ]; then
            CUSTOM_DOMAIN=$(jq -r '.site.customDomain // empty' config.json)
            GENERATE_CNAME=$(jq -r '.deployment.generateCNAME' config.json)
            if [ "$GENERATE_CNAME" = "true" ] && [ -n "$CUSTOM_DOMAIN" ]; then
              echo "$CUSTOM_DOMAIN" > ./deploy/CNAME
              echo "✅ Generated CNAME for $CUSTOM_DOMAIN"
            fi
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          commit_message: "chore: update course data $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Display statistics
        run: |
          pipenv run scraper --db ./db/courses.db stats
