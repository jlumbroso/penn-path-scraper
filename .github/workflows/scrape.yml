name: Scrape Penn Courses

on:
  schedule:
    # Run daily at 6 AM UTC (2 AM ET)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggers
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scrape.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: |
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --deploy

      - name: Restore database from gh-pages
        run: |
          # Try to download existing database from gh-pages branch
          git clone --branch gh-pages --single-branch --depth 1 https://github.com/${{ github.repository }}.git gh-pages-db || true

          mkdir -p ./db

          if [ -f "gh-pages-db/db/courses.db" ]; then
            cp gh-pages-db/db/courses.db ./db/courses.db
            echo "✅ Restored database from gh-pages branch"
          else
            echo "ℹ️  No existing database found - starting fresh"
          fi

      - name: Scrape current and next term
        run: |
          # Create db directory
          mkdir -p ./db

          # Scrape current term
          pipenv run scraper --db ./db/courses.db scrape

          # Scrape next term
          pipenv run scraper --db ./db/courses.db scrape --next-term

      - name: Export to JSON (granular ADR-0002 structure)
        run: |
          pipenv run scraper --db ./db/courses.db export --output-dir .

      - name: Prepare deployment directory
        run: |
          # Create deployment directory
          mkdir -p ./deploy

          # Copy landing page to root
          cp -r ./landing/* ./deploy/

          # Copy API data
          cp -r ./api ./deploy/

          # Copy database to deployment (for persistence)
          mkdir -p ./deploy/db
          cp ./db/courses.db ./deploy/db/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          commit_message: "chore: update course data $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Display statistics
        run: |
          pipenv run scraper --db ./db/courses.db stats
