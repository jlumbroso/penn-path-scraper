<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penn Path Scraper API</title>
    <meta http-equiv="refresh" content="0; url=../">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #011F5B 0%, #0A3380 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: #63C7FF;
            color: #011F5B;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        a:hover {
            background: white;
            transform: translateY(-2px);
        }
        .api-link {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .api-link a {
            background: transparent;
            border: 2px solid #63C7FF;
            color: #63C7FF;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .api-link a:hover {
            background: #63C7FF;
            color: #011F5B;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Penn Path Scraper API</h1>
        <p>Redirecting to the main landing page...</p>
        <a href="../">Go to Landing Page</a>
        <div class="api-link">
            Or access the <a href="v1/index.json">API Master Index</a>
        </div>
    </div>
</body>
</html>
